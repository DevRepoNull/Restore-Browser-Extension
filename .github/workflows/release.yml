name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ExtensionVault-windows
            exe: ExtensionVault.exe
          - os: macos-latest
            artifact: ExtensionVault-macos
            exe: ExtensionVault
          - os: ubuntu-latest
            artifact: ExtensionVault-linux
            exe: ExtensionVault
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build
        run: >
          python -m PyInstaller
          --noconfirm --clean --windowed --onefile
          --name ExtensionVault
          app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ExtensionVault-windows/ExtensionVault.exe
            ExtensionVault-macos/ExtensionVault
            ExtensionVault-linux/ExtensionVault
          generate_release_notes: true
